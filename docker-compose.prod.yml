version: '3.8'

services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: dekorasi_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dekorasi_network
    # Production optimizations
    mem_limit: 256m
    cpu_limit: 0.5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dekorasi_backend_prod
    restart: always
    working_dir: /var/www/html
    ports:
      - "8001:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost:8001
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - redis
    networks:
      - dekorasi_network
    # Production limits
    mem_limit: 512m
    cpu_limit: 1.0
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: dekorasi_frontend_prod
    restart: always
    working_dir: /app
    ports:
      - "3001:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      NEXT_PUBLIC_STORAGE_URL: http://localhost:8001/storage
      NEXT_PUBLIC_APP_NAME: NacaDecor
    depends_on:
      - backend
    networks:
      - dekorasi_network
    # Production limits
    mem_limit: 384m
    cpu_limit: 0.5
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: dekorasi_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - dekorasi_network

volumes:
  redis_data:
  backend_storage:
  backend_logs:

networks:
  dekorasi_network:
    driver: bridge
