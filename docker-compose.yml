services:
  redis:
    image: docker.io/library/redis:alpine
    container_name: dekorasi_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dekorasi_backend
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: "NacaDecor"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    command: php artisan serve --no-reload --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dekorasi_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8001/api/v1
      NEXT_PUBLIC_STORAGE_URL: http://127.0.0.1:8001/storage
      NEXT_PUBLIC_APP_NAME: "NacaDecor"
    depends_on:
      - backend

volumes:
  redis_data:
